<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моя сторінка</title>
  <style>
    /* Reset the browser defaults that caused the layout surprises */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .header {
      background-color: #2c3e50;
      padding: 20px;
    }

    .nav-list {
      display: flex;
      list-style: none;
      margin: 0;
      padding: 0;              /* removes the default 40px indent */
      gap: 20px;
      justify-content: center;
    }

    .nav-list a {
      color: white;
      text-decoration: none;
    }

    .nav-list a:hover,
    .nav-list a:focus-visible {
      text-decoration: underline;
    }

    .hero {
      text-align: center;
      padding: 100px 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 30px;
      background: #c0392b;     /* darker red: passes contrast with white text */
      color: white;            /* semicolon added */
      text-decoration: none;
      border-radius: 5px;
    }

    .btn:hover {
      background: #a93226;
    }
  </style>
</head>
<body>
  <header class="header">
    <nav class="navigation">
      <ul class="nav-list">
        <li><a href="/">Головна</a></li>
        <li><a href="/about">Про нас</a></li>
        <li><a href="/contact">Контакти</a></li>
      </ul>
    </nav>
  </header>

  <main class="main">
    <section class="hero">
      <h1>Ласкаво просимо!</h1>
      <p>Це мій перший сайт</p>
      <a href="#features" class="btn">Дізнатися більше</a>
    </section>

    <section id="features">
      <!-- the button's link target; add your content here -->
    </section>
  </main>
</body>
</html>
