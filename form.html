<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>About You</h2>
    <form action="/login">
        <label name="name"><b>Name</b></label>
        <br>
        <input placeholder="Name" name="name">
        <br>
        <br>
        <label name="age"><b>Age</b></label>
        <br>
        <input placeholder="Age" name="age" type="number", max="100", min="0">
        <br>
        <br>
        <label name="bio"><b>Description</b></label>
        <br>
        <textarea placeholder="Tell a little about yourself...", name="bio"></textarea>
    <button type="submit">Submit</button>
    </form>
</body>
</html>
